<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | News homepage</title>

    <link rel="stylesheet" href="styles.css" />

    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <div class="icon-container">
        <img
          src="./assets/images/logo.svg"
          alt="Logo icon of letter W followed by a period"
        />
      </div>

      <nav class="desktop-nav">
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">New</a></li>
          <li><a href="#">Popular</a></li>
          <li><a href="#">Trending</a></li>
          <li><a href="#">Categories</a></li>
        </ul>
      </nav>

      <button
        class="mobile-menu-open-button"
        aria-label="Open menu"
        aria-controls="mobile-sidebar"
        aria-expanded="false"
      >
        <svg width="40" height="17" xmlns="http://www.w3.org/2000/svg">
          <g fill="#00001A" fill-rule="evenodd">
            <path d="M0 0h40v3H0zM0 7h40v3H0zM0 14h40v3H0z" />
            <path d="M0 0h40v3H0z" />
          </g>
        </svg>
      </button>
    </header>

    <nav id="mobile-sidebar" class="mobile-sidebar" aria-hidden="true">
      <button class="mobile-menu-close-button" aria-label="Close menu">
        <svg width="32" height="31" xmlns="http://www.w3.org/2000/svg">
          <g fill="#00001A" fill-rule="evenodd">
            <path d="m2.919.297 28.284 28.284-2.122 2.122L.797 2.419z" />
            <path d="M.797 28.581 29.081.297l2.122 2.122L2.919 30.703z" />
          </g>
        </svg>
      </button>

      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">New</a></li>
        <li><a href="#">Popular</a></li>
        <li><a href="#">Trending</a></li>
        <li><a href="#">Categories</a></li>
      </ul>
    </nav>
  </body>
</html>
